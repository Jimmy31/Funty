org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Le cache incrémental Kotlin plante ("this and base files have different
# roots") dès qu'une dépendance native (ex. audioplayers_android) vit dans
# le cache pub (C:) alors que le projet est sur un autre lecteur (E:) —
# bug connu de RelocatableFileToPathConverter sous Windows. Désactiver
# l'incrémental évite le calcul de chemin relatif fautif.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
